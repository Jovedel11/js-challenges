<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="todoApp.css">
  <title>Document</title>
</head>
<body>

  <header class="container">
      <h1>Todo App</h1>
  </header>
  <main class="main-container">
    <div class="todo-container">
      <div class="title">
        <h2>Todo Form</h2>
      </div>
      <form class="todo-form">
        <div class="input-field">
          <input type="text" class="todo-field" placeholder="Add todo">
          <button type="submit" class="ctn-add">+</button>
        </div>
      </form>
      <div class="show-todo">
        <ul class="all-todo">
        </ul>
      </div>
    </div>
  </main>
  
  <script src="todoApp.js"></script>
</body>
</html>
