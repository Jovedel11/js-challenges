<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="dasda.css">
</head>
<body>
  <main class="main-layout">
    <div class="grid-container">
    <div class="right-container">
    <header class="header-container">
    <div class="logo-title">
      <h1 class="title">Weather Forecast</h1>
    </div>
    <div class="search-container">
      <input type="text" placeholder="Search New Places" class="search">
    </div>
  </header>
  <main class="main-container">
    <div class="grid-layout">
      <div class="weeks">
        <span>Week</span>
        <p>Monday</p>
        <p>Tuesday</p>
        <p>Wednesday</p>
        <p>Thursday</p>
        <p>Friday</p>
      </div>
      <div class="sunday">
        <span>Month</span>
        <p>💧54%</p>
        <p>💧24%</p>
        <p>💧54%</p>
        <p>💧54%</p>
        <p>💧54%</p>
      </div>
      <div class="monday">
        <span>3 Months</span>
        <p>⛅</p>
        <p>☀</p>
        <p>⛅</p>
        <p>⛅</p>
        <p>⛅</p>
      </div>
      <div class="tuesday">4 Months</div>
    </div>
  </main>
  <div class="bottom-container">
    <div class="head">
      <h3>Weather</h3>
      <div class="temps">
      <span class="temp">Highest temp 8ºC</span>
      <span class="temp">Highest temp -6ºC</span>
      </div>
      <div class="dropdown-container">
        <select 
        name="dropdown" id="dropdown" title="dropdown">
          <option value="Today">Today</option>
        </select>
      </div>
    </div>
    <div>

    </div>
    <div>

    </div>
    <div>

    </div>
  </div>
  </div>
  <div class="side-container">
    <div class="side-title">
      <h1 class="side-h1">Today</h1> 
      <span class="date">Fri, 11 Nov</span>
    </div>
    <div class="side-indetifier">
      <h1 class="degree">29ºC</h1>
      <span class="where">Deihi India</span>
      <p class="para">Feels Like 32 • Sunset 18:15</p>
    </div>
    <div class="row-container">
      <span class="cloud">☁12n/h</span>
      <span class="time">🧭55%</span>
      <span class="wind">🌫99pa</span>
    </div>
    <div>
      <div class="get-div">
        
      </div>
    </div>
  </div>
  </div>
  </main>
  <script src="dasda.js"></script>
</body>
</html>
